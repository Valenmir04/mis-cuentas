<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Cuentas">
<title>Mis Cuentas</title>
<link rel="manifest" href="manifest.json">
<script>try{var t=JSON.parse(localStorage.getItem('mc_tema'));if(t==='claro')document.documentElement.dataset.theme='light';if(t==='oscuro')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F5D50'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23F6F1E7' font-family='Georgia'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --surface-2:#EFE8DA; --ink:#1E2624; --muted:#6B726E; --line:#E4DBCB;
  --green:#2F5D50; --green-soft:#DCE8E2; --bordo:#7A2E3A; --bordo-soft:#F3E1E3;
  --navy:#1F3A5F; --navy-soft:#DFE6F0; --gold:#A87A26; --gold-soft:#F4E8CF;
  --shadow:0 1px 2px rgba(30,38,36,.05),0 10px 30px rgba(30,38,36,.06);
  --r:20px; --font:'DM Sans',system-ui,-apple-system,sans-serif; --display:'Fraunces',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1A211E; --surface-2:#232C28; --ink:#ECE7DC; --muted:#99A19C; --line:#2C3632;
    --green:#82BBA7; --green-soft:#1D312A; --bordo:#E48C99; --bordo-soft:#3A2228;
    --navy:#93B3DE; --navy-soft:#1C2939; --gold:#E2B864; --gold-soft:#372D1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A211E; --surface-2:#232C28; --ink:#ECE7DC; --muted:#99A19C; --line:#2C3632;
  --green:#82BBA7; --green-soft:#1D312A; --bordo:#E48C99; --bordo-soft:#3A2228;
  --navy:#93B3DE; --navy-soft:#1C2939; --gold:#E2B864; --gold-soft:#372D1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Estructura ---------- */
.app{max-width:1040px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--bg);display:grid;place-items:center;font-size:19px}
.badge-demo{font-family:var(--font);font-size:11px;font-weight:600;background:var(--gold-soft);color:var(--gold);padding:3px 8px;border-radius:99px;letter-spacing:.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active{transform:scale(.96)}
.icon-btn.girando svg{animation:girar .9s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

.mes{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:16px}
.mes button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.mes button:hover{background:var(--surface-2)}
.mes strong{font-family:var(--display);font-weight:600;font-size:17px;text-transform:capitalize}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:12px;min-width:68px}
nav.tabs button.on{color:var(--green)}
nav.tabs button.on svg{stroke-width:2.3}

.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:21;width:58px;height:58px;border-radius:19px;background:var(--green);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 26px rgba(47,93,80,.35)}
.fab svg{width:26px;height:26px;stroke-width:2.4}
.fab:active{transform:scale(.95)}

@media (min-width:820px){
  .app{padding-bottom:60px}
  nav.tabs{position:sticky;top:12px;bottom:auto;justify-content:flex-start;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin:0 0 16px;backdrop-filter:none}
  nav.tabs button{flex-direction:row;font-size:14px;gap:8px;padding:9px 16px}
  nav.tabs button.on{background:var(--green-soft)}
  .fab{bottom:28px;right:28px}
  .wrap-nav{display:flex;gap:12px;align-items:flex-start}
}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:12px}
@media (min-width:820px){.grid.g2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}

.hero{background:var(--green);color:#F6F1E7;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:13px;opacity:.8;font-weight:500}
.hero .big{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:4px 0 14px}
.hero .fila{display:flex;gap:10px;flex-wrap:wrap}
.hero .sub{font-size:13px;opacity:.8;margin-bottom:14px;position:relative;z-index:1}
.hero .pill{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:13px;flex:1;min-width:130px}
.hero .pill b{display:block;font-size:16px;font-weight:600;margin-top:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#24453B}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:820px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:22px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.c-green{color:var(--green)}.c-bordo{color:var(--bordo)}.c-navy{color:var(--navy)}.c-gold{color:var(--gold)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog>span{display:block;height:100%;border-radius:99px;background:var(--navy)}

.dona-wrap{position:relative;height:220px;margin:4px auto 10px;max-width:260px}
.dona-centro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.dona-centro small{display:block;font-size:12px;color:var(--muted)}
.dona-centro b{font-family:var(--display);font-size:20px;font-weight:600}
.barras{display:flex;flex-direction:column;gap:10px}
.barra-fila{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.barra-fila .em{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px}
.barra-fila .nm{font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.barra-fila .nm small{color:var(--muted);font-weight:500}
.barra-fila .tr{height:6px;border-radius:99px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.barra-fila .tr span{display:block;height:100%;border-radius:99px}
.barra-fila .mt{font-size:14px;font-weight:600;text-align:right}

.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:6px 0 12px}
.split span{display:block;height:100%}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leyenda b{display:block;font-size:17px;font-family:var(--display);font-weight:600;margin-top:2px}
.chart-box{position:relative;height:220px}

.vacio{text-align:center;padding:34px 16px;color:var(--muted)}
.vacio .em{font-size:34px;margin-bottom:8px}
.vacio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- Movimientos ---------- */
.rapido{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:12px}
.rapido input{flex:1;border:0;background:none;outline:none;min-width:0;padding:8px 0}
.rapido button{background:var(--green);color:var(--bg);border-radius:11px;width:40px;height:40px;display:grid;place-items:center}
.ayuda{font-size:12px;color:var(--muted);margin:-6px 4px 14px}
.buscador{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.buscador input{flex:1;border:0;background:none;outline:none;padding:11px 0;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dia{margin-bottom:16px}
.dia-tit{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);padding:0 6px 6px;text-transform:capitalize}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mov{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.mov:active{background:var(--surface-2)}
.mov .em{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px}
.mov b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .mt{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.mov .mt.neg{color:var(--ink)} .mov .mt.pos{color:var(--green)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;letter-spacing:.02em;vertical-align:1px}
.tag.fijo{background:var(--navy-soft);color:var(--navy)}
.tag.siri{background:var(--gold-soft);color:var(--gold)}
.tag.auto{background:var(--green-soft);color:var(--green)}
.tag.tarj{background:var(--bordo-soft);color:var(--bordo)}
.hero .nota-pill{display:block;font-size:11.5px;opacity:.8;margin-top:2px}
.tj-head{background:var(--bordo-soft);border-radius:16px;padding:16px;margin-bottom:14px}
.tj-head small{display:block;font-size:12px;font-weight:600;color:var(--bordo)}
.tj-head b{display:block;font-family:var(--display);font-size:30px;font-weight:600;color:var(--bordo);margin:2px 0 6px}
.tj-head p{font-size:13px;color:var(--ink)}
.tj-lista{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.tj-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tj-item:last-child{border-bottom:0}
.tj-item small{display:block;color:var(--muted);font-size:12px}
.tj-item b{font-weight:600}
.tj-tit{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;margin-top:6px}

/* ---------- Fijos ---------- */
.fijos-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.fijos-head .v{font-family:var(--display);font-size:26px;font-weight:600}
.fijo{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.fijo:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:.15s}
.check svg{width:16px;height:16px;stroke-width:3}
.fijo.pagado .check{background:var(--green);border-color:var(--green);color:var(--bg)}
.fijo.vencido .check{border-color:var(--bordo)}
.fijo .mid{text-align:left;min-width:0}
.fijo .mid b{display:block;font-weight:600}
.fijo .mid small{color:var(--muted);font-size:12.5px}
.fijo .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:flex-start}
.fijo .badges .tag,.mov .tag{display:inline-block;line-height:1.5;padding:1px 7px;height:auto;width:auto}
.fijo .mid,.fijo .der{display:block}
.fijo .der{text-align:right}
.fijo .der .mt{font-weight:700;display:block}
.fijo .der .est{font-size:11.5px;font-weight:600}
.fijo.pagado .mid b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.est.pagado{color:var(--green)}.est.vencido{color:var(--bordo)}.est.pendiente{color:var(--muted)}.est.auto{color:var(--navy)}
.inactivo{opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.prim{background:var(--green);color:var(--bg);border-color:var(--green)}
.btn.peligro{color:var(--bordo);background:var(--bordo-soft);border-color:transparent}
.btn.full{width:100%}
.btn:disabled{opacity:.6}

/* ---------- Formularios / hojas ---------- */
.capa{position:fixed;inset:0;z-index:50;background:rgba(18,23,21,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.capa.on{opacity:1;pointer-events:auto}
.hoja{background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;transform:translateY(30px);transition:transform .25s}
.capa.on .hoja{transform:none}
@media (min-width:640px){.capa{align-items:center}.hoja{border-radius:26px;padding-bottom:22px}}
.asa{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.hoja h2{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:14px}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;font-size:16px}
.campo input:focus,.campo select:focus{border-color:var(--green)}
.monto-input{font-family:var(--display);font-size:30px!important;font-weight:600;text-align:center}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on[data-v="gasto"]{background:var(--bordo);color:#fff}
.seg button.on[data-v="ingreso"]{background:var(--green);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}
.acciones{display:flex;gap:10px;margin-top:16px}
.acciones .btn{flex:1}
.nota{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:12px}

/* ---------- Bienvenida / ajustes ---------- */
.bienvenida{max-width:460px;margin:6vh auto 0}
.bienvenida .logo-xl{width:64px;height:64px;border-radius:20px;background:var(--green);color:var(--bg);display:grid;place-items:center;font-size:32px;font-family:var(--display);margin-bottom:18px}
.bienvenida h1{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px}
.bienvenida p.lead{color:var(--muted);margin-bottom:22px}
.link{color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sep{text-align:center;color:var(--muted);font-size:13px;margin:16px 0}
.frases{display:flex;flex-direction:column;gap:8px}
.frases div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.frases div::before{content:"🎙️ ";}
.estado-con{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.estado-con i{width:9px;height:9px;border-radius:50%;background:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:min(92vw,440px);z-index:60;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bordo);color:#fff}
@media (min-width:820px){.toast{bottom:40px}}
.carga{position:fixed;top:0;left:0;height:3px;background:var(--green);z-index:70;width:0;transition:width .4s}
.carga.on{width:70%;transition:width 4s cubic-bezier(.1,.6,.3,1)}
.esqueleto{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:brillo 1.2s infinite;margin-bottom:12px}
@keyframes brillo{to{background-position:-200% 0}}
.hero.navy{background:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero.navy{background:#22344D}}
.hero .pill.ancho{flex-basis:100%}
.seg-moneda button.on{background:var(--ink);color:var(--bg)}
.seg.cuatro{grid-template-columns:1fr 1fr;gap:4px}
.seg button.on[data-v="ahorro"]{background:var(--gold);color:#fff}
.seg button.on[data-v="retiro"]{background:var(--navy);color:#fff}

<script>
/* ============================================================
   Mis Cuentas · interfaz
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const guardado = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const mesActual = () => hoyISO().slice(0, 7);
const diasDelMes = mes => new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
const moverMes = (mes, n) => { const d = new Date(+mes.slice(0, 4), +mes.slice(5, 7) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
const labelMes = mes => capital(new Date(+mes.slice(0, 4), +mes.slice(5, 7) - 1, 1).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }).replace(' de ', ' '));
const mesCorto = mes => new Date(+mes.slice(0, 4), +mes.slice(5, 7) - 1, 1).toLocaleDateString('es-AR', { month: 'short' }).replace('.', '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fARS = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
const fUSD = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const plata = (n, mon = 'ARS') => (mon === 'USD' ? fUSD : fARS).format(n || 0).replace(/\s/g, ' ');
const suma = arr => arr.reduce((a, m) => a + (Number(m.monto) || 0), 0);
const leerMonto = s => Number(String(s).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) || 0;

const S = {
  cfg: guardado.get('mc_cfg'),
  demo: false,
  datos: null,
  mes: mesActual(),
  vista: guardado.get('mc_vista') || 'resumen',
  filtro: 'todos',
  moneda: guardado.get('mc_moneda') || 'ARS',
  verAhorroEn: guardado.get('mc_verahorro') || '',
  wiz: null,
  forzarWizard: false,
  busqueda: '',
  graficos: []
};

/* ---------------- Conexión con la planilla ---------------- */
async function llamar(accion, extra = {}) {
  if (S.demo) return demoApi(accion, extra);
  const r = await fetch(S.cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: S.cfg.token, accion, ...extra })
  });
  if (!r.ok) throw new Error('No pude conectar con tu planilla (' + r.status + ').');
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('La URL no parece ser la de tu Apps Script. Revisala en Ajustes.'); }
  if (!j.ok) throw new Error(j.mensaje || j.error || 'Algo falló.');
  if (j.datos) { S.datos = j.datos; guardado.set('mc_cache', j.datos); }
  return j;
}

async function hacer(accion, extra, msgOk) {
  cargando(true);
  try {
    const j = await llamar(accion, extra);
    render();
    if (msgOk !== false) toast(msgOk || j.mensaje || 'Listo');
    return j;
  } catch (e) {
    toast(e.message, true);
    throw e;
  } finally { cargando(false); }
}

function cargando(on) {
  $('#carga').classList.toggle('on', on);
  $('#btnSync').classList.toggle('girando', on);
  if (!on) { $('#carga').style.width = '100%'; setTimeout(() => $('#carga').style.width = '', 350); }
}

let tToast;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('on');
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('on'), err ? 4500 : 3000);
}

/* ---------------- Ayudas sobre los datos ---------------- */
const cats = tipo => (S.datos?.categorias || []).filter(c => !tipo || c.tipo === tipo);
const CATS_ESPECIALES = { 'Pago de tarjeta': { nombre: 'Pago de tarjeta', emoji: '💳', color: '#7A2E3A' }, 'Ahorro': { nombre: 'Ahorro', emoji: '🐷', color: '#B8862F' }, 'Venta de dólares': { nombre: 'Venta de dólares', emoji: '💱', color: '#1F3A5F' }, 'Retiro de ahorros': { nombre: 'Retiro de ahorros', emoji: '↩︎', color: '#1F3A5F' } };
const catInfo = nombre => (S.datos?.categorias || []).find(c => c.nombre === nombre) || CATS_ESPECIALES[nombre] || { nombre, emoji: '📦', color: '#A39E93' };
const medios = () => (S.datos?.medios || []).map(m => m.nombre);
const movsDelMes = (mes = S.mes) => (S.datos?.movimientos || []).filter(m => m.mes === mes);
const fondo = (color, a = .16) => { const h = (color || '#A39E93').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };

function estadoFijos(mes = S.mes) {
  const movs = movsDelMes(mes);
  const hoy = hoyISO(), mesHoy = hoy.slice(0, 7), diaHoy = +hoy.slice(8, 10);
  return (S.datos?.fijos || []).filter(f => f.activo).map(f => ({ ...f, moneda: f.moneda === 'USD' ? 'USD' : 'ARS' })).map(f => {
    const pago = movs.find(m => m.idFijo === f.id);
    const dia = Math.min(f.dia || 1, diasDelMes(mes));
    let estado = 'pendiente';
    if (pago) estado = 'pagado';
    else if (mes < mesHoy || (mes === mesHoy && dia < diaHoy)) estado = 'vencido';
    return { f, pago, dia, estado };
  }).sort((a, b) => (a.estado === 'pagado') - (b.estado === 'pagado') || a.dia - b.dia);
}

/* ---------------- Render principal ---------------- */
function render() {
  if (!S.cfg && !S.demo) return renderBienvenida();
  if (S.datos && !S.demo && (S.forzarWizard || !AJ().configurado)) return renderWizard();
  $('#bienvenida').hidden = true; $('#app').hidden = false; $('#fab').hidden = false;
  $('#mesLabel').textContent = labelMes(S.mes);
  $('#demoBadge').hidden = !S.demo;
  $('#barraMes').hidden = S.vista === 'ajustes';
  $('#fab').hidden = S.vista === 'ajustes';
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.vista));
  $$('.vista').forEach(v => v.hidden = v.id !== 'v-' + S.vista);
  S.graficos.forEach(g => g.destroy()); S.graficos = [];
  if (S.vista === 'ajustes') return renderAjustes();
  if (!S.datos) { $('#v-' + S.vista).innerHTML = '<div class="esqueleto"></div><div class="esqueleto"></div>'; return; }
  (({ resumen: renderResumen, movimientos: renderMovimientos, fijos: renderFijos, ahorros: renderAhorros })[S.vista] || renderResumen)();
}

/* ---------------- Núcleo (es el mismo código que usa la planilla) ---------------- */
/* ==== NÚCLEO COMPARTIDO (igual en Codigo.gs y en index.html) ==== */

/** Ajustes con valores por defecto y migración desde versiones anteriores. */
function completarAjustes(aj) {
  aj = aj || {};
  var n = function (v) { return Number(String(v === undefined || v === null ? '' : v).replace(',', '.')) || 0; };
  var lista = function (v) {
    if (Array.isArray(v)) return v;
    try { var x = JSON.parse(v || '[]'); return Array.isArray(x) ? x : []; } catch (e) { return []; }
  };
  var tiene = function (k) { return aj[k] !== undefined && aj[k] !== null && aj[k] !== ''; };
  var r = {
    configurado: tiene('configurado') ? (aj.configurado === true || aj.configurado === 'si') : !!aj.fechaInicialARS,
    saldoInicialARS: n(aj.saldoInicialARS),
    fechaInicialARS: String(aj.fechaInicialARS || ''),
    cuentaUSD: tiene('cuentaUSD') ? (aj.cuentaUSD === true || aj.cuentaUSD === 'si') : true,
    saldoInicialCuentaUSD: n(aj.saldoInicialCuentaUSD),
    // antes "saldoInicialUSD" era lo que tenías ahorrado en dólares
    saldoInicialAhorroUSD: tiene('saldoInicialAhorroUSD') ? n(aj.saldoInicialAhorroUSD) : n(aj.saldoInicialUSD),
    saldoInicialAhorroARS: n(aj.saldoInicialAhorroARS),
    ahorroMonedas: tiene('ahorroMonedas') ? String(aj.ahorroMonedas).split(',').filter(function (x) { return x === 'ARS' || x === 'USD'; }) : ['USD'],
    cotizacionReferencia: n(aj.cotizacionReferencia),
    tarjetas: lista(aj.tarjetas),
    frases: lista(aj.frases)
  };
  if (!r.ahorroMonedas.length) r.ahorroMonedas = ['USD'];
  // una sola tarjeta configurada con la versión anterior
  if (!tiene('tarjetas') && n(aj.cierreTarjeta)) {
    r.tarjetas = [{ id: 't1', nombre: 'Crédito', cierre: n(aj.cierreTarjeta), vence: n(aj.vencimientoTarjeta),
      deudaInicial: n(aj.deudaInicialTarjeta), consumosIniciales: n(aj.consumosInicialesTarjeta), fecha: String(aj.fechaTarjeta || aj.fechaInicialARS || '') }];
  }
  return r;
}

function normSimple(s) {
  return String(s === null || s === undefined ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
}

/** ¿A qué tarjeta corresponde este medio de pago? Devuelve la tarjeta o null si no es crédito. */
function tarjetaDeMedio(medio, tarjetas) {
  var m = normSimple(medio);
  if (!m) return null;
  for (var i = 0; i < tarjetas.length; i++) if (normSimple(tarjetas[i].nombre) === m) return tarjetas[i];
  if (/credito/.test(m)) return tarjetas[0] || { id: '_', nombre: 'Crédito', cierre: 0 };
  return null;
}

/** Gasto en pesos con tarjeta de crédito: va a la tarjeta y se descuenta de tu plata recién cuando pagás el resumen. */
function vaATarjetaCon(m, tarjetas) { return m.tipo === 'gasto' && m.moneda !== 'USD' && !!tarjetaDeMedio(m.medio, tarjetas); }

/** Todas las tarjetas a mostrar: las configuradas, o una genérica si usás "Crédito" sin haber configurado ninguna. */
function tarjetasActivas(movs, aj) {
  if (aj.tarjetas.length) return aj.tarjetas;
  var usa = movs.some(function (m) { return (m.tipo === 'pagoTarjeta' || vaATarjetaCon(m, [])); });
  return usa ? [{ id: '_', nombre: 'Crédito', cierre: 0 }] : [];
}

/**
 * Estado de UNA tarjeta. Con día de cierre: por resúmenes (cada compra va al resumen que cierra primero; cada cuota, un resumen después).
 * Sin día de cierre: estimado simple. Los pagos se aplican primero a lo más viejo.
 */
function calcularTarjeta(movs, card, hoy, tarjetas) {
  var pad = function (n) { return ('0' + n).slice(-2); };
  var mover = function (mes, n) { var t = +mes.slice(0, 4) * 12 + (+mes.slice(5, 7) - 1) + n; return Math.floor(t / 12) + '-' + pad(t % 12 + 1); };
  var dias = function (mes) { return new Date(Date.UTC(+mes.slice(0, 4), +mes.slice(5, 7), 0)).getUTCDate(); };
  var lista = tarjetas && tarjetas.length ? tarjetas : [card];
  var esDeEsta = function (m) { var t = tarjetaDeMedio(m.medio, lista); return !!t && (t.id === card.id || normSimple(t.nombre) === normSimple(card.nombre)); };
  var desde = card.fecha || '';
  var ms = movs.filter(function (m) { return m.fecha >= desde; });
  var compras = ms.filter(function (m) { return m.tipo === 'gasto' && m.moneda !== 'USD' && esDeEsta(m); });
  var pagos = ms.filter(function (m) { return m.tipo === 'pagoTarjeta' && esDeEsta(m); })
    .sort(function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });
  var dIni = Number(card.deudaInicial) || 0, cIni = Number(card.consumosIniciales) || 0;
  var totalPagos = pagos.reduce(function (a, p) { return a + p.monto; }, 0);
  var base = { card: card, nombre: card.nombre, ultimoPago: pagos[pagos.length - 1] || null };
  var C = Math.min(31, Math.max(0, Math.round(Number(card.cierre) || 0)));

  if (!C) {
    // Sin cierre: próximo pago = lo comprado desde el último pago + cuotas que siguen
    var deuda0 = dIni + cIni + compras.reduce(function (a, m) { return a + m.monto; }, 0) - totalPagos;
    var prox = pagos.length ? 0 : dIni + cIni, nuevos = [], viejas = [];
    compras.forEach(function (m) {
      var n = Math.max(1, Number(m.cuotas) || 1);
      var pagadas = pagos.filter(function (p) { return p.fecha > m.fecha; }).length;
      if (pagadas < n) {
        prox += m.monto / n;
        (pagadas === 0 ? nuevos : viejas).push({ id: m.id, descripcion: m.descripcion || m.categoria, fecha: m.fecha, monto: m.monto, n: n, cuotaNro: pagadas + 1 });
      }
    });
    base.conCiclos = false; base.deuda = Math.max(0, deuda0); base.proximo = Math.max(0, Math.min(prox, deuda0));
    base.nuevos = nuevos; base.cuotasViejas = viejas; base.deudaIni = dIni + cIni;
    return base;
  }

  var V = Math.min(31, Math.max(1, Math.round(Number(card.vence) || 0) || Math.min(31, C + 10)));
  var cierre = function (ciclo) { return ciclo + '-' + pad(Math.min(C, dias(ciclo))); };
  var vence = function (ciclo) { var mv = V > C ? ciclo : mover(ciclo, 1); return mv + '-' + pad(Math.min(V, dias(mv))); };
  var cicloDe = function (f) { var mes = f.slice(0, 7); return f <= cierre(mes) ? mes : mover(mes, 1); };
  var ciclos = {};
  var add = function (ciclo, monto, item) {
    if (!ciclos[ciclo]) ciclos[ciclo] = { ciclo: ciclo, monto: 0, items: [] };
    ciclos[ciclo].monto += monto; ciclos[ciclo].items.push(item);
  };
  var cicloIni = cicloDe(desde || hoy);
  if (dIni) add(mover(cicloIni, -1), dIni, { descripcion: 'Resumen que ya había cerrado', fecha: desde, monto: dIni, n: 1, cuotaNro: 1, inicial: true });
  if (cIni) add(cicloIni, cIni, { descripcion: 'Consumos que ya tenías', fecha: desde, monto: cIni, n: 1, cuotaNro: 1, inicial: true });
  compras.forEach(function (m) {
    var n = Math.max(1, Number(m.cuotas) || 1), c0 = cicloDe(m.fecha);
    for (var k = 0; k < n; k++) add(mover(c0, k), m.monto / n, { id: m.id, descripcion: m.descripcion || m.categoria, fecha: m.fecha, monto: m.monto, n: n, cuotaNro: k + 1 });
  });
  var resto = totalPagos;
  var todos = Object.keys(ciclos).sort().map(function (k) {
    var c = ciclos[k];
    c.pagado = Math.min(resto, c.monto); resto -= c.pagado;
    c.pendiente = c.monto - c.pagado; c.cierra = cierre(c.ciclo); c.vence = vence(c.ciclo);
    return c;
  });
  var abierto = cicloDe(hoy);
  var actual = ciclos[abierto] || { ciclo: abierto, monto: 0, items: [], pagado: 0, pendiente: 0, cierra: cierre(abierto), vence: vence(abierto) };
  var cerrados = todos.filter(function (c) { return c.ciclo < abierto && c.pendiente > 0.5; });
  var futuros = todos.filter(function (c) { return c.ciclo > abierto && c.pendiente > 0.5; });
  var sumaP = function (l) { return l.reduce(function (a, c) { return a + c.pendiente; }, 0); };
  var aPagar = sumaP(cerrados);
  base.conCiclos = true; base.cerrados = cerrados; base.aPagar = aPagar;
  base.venceCerrado = cerrados.length ? cerrados[cerrados.length - 1].vence : '';
  base.vencido = cerrados.some(function (c) { return c.vence < hoy; });
  base.actual = actual; base.futuros = futuros; base.enCuotasFuturas = sumaP(futuros);
  base.deuda = aPagar + actual.pendiente + sumaP(futuros);
  base.proximo = aPagar > 0.5 ? aPagar : actual.pendiente;
  base.fechaCierre = cierre; base.fechaVence = vence; base.cicloDe = cicloDe;
  return base;
}

/**
 * Saldos al cierre de un mes (hasta = 'aaaa-mm', o vacío = todo):
 *  ars: cuenta en pesos (null si no cargaste el saldo inicial) · usd: cuenta en dólares
 *  ahorroUSD / ahorroARS: ahorros. Si no tenés cuenta en dólares, lo que gastás/cobrás en dólares sale/entra de tus ahorros en dólares.
 */
function calcularSaldos(movs, aj, hasta) {
  var tarjetas = aj.tarjetas || [];
  var s = { ars: aj.fechaInicialARS ? aj.saldoInicialARS : null, usd: aj.saldoInicialCuentaUSD, ahorroUSD: aj.saldoInicialAhorroUSD, ahorroARS: aj.saldoInicialAhorroARS };
  movs.forEach(function (m) {
    if (hasta && m.mes > hasta) return;
    var enArs = s.ars !== null && m.fecha >= aj.fechaInicialARS;
    var dePesos = function (v) { if (enArs) s.ars += v; };
    var deUSD = function (v) { if (aj.cuentaUSD) s.usd += v; else s.ahorroUSD += v; };
    var cuentaUSD = m.cuenta === 'USD';
    if (m.tipo === 'ahorro' || m.tipo === 'retiro') {
      var sg = m.tipo === 'ahorro' ? 1 : -1;
      if (m.moneda === 'ARS') { s.ahorroARS += sg * m.monto; dePesos(-sg * m.monto); return; }
      s.ahorroUSD += sg * m.monto;
      if (cuentaUSD) { if (aj.cuentaUSD) s.usd -= sg * m.monto; }
      else dePesos(-sg * (m.pesos || 0));
      return;
    }
    if (m.tipo === 'pagoTarjeta') { dePesos(-m.monto); return; }
    var signo = m.tipo === 'ingreso' ? 1 : -1;
    if (m.moneda === 'USD') { deUSD(signo * m.monto); return; }
    if (vaATarjetaCon(m, tarjetas)) return; // se descuenta cuando pagás el resumen
    dePesos(signo * m.monto);
  });
  return s;
}

/* ---------------- Ayudas de cuentas, ahorros y tarjetas ---------------- */
const AJ = () => completarAjustes(S.datos?.ajustes);
const tarjetasCfg = () => AJ().tarjetas;
const esCredito = medio => !!tarjetaDeMedio(medio, tarjetasCfg());
const vaATarjeta = m => vaATarjetaCon(m, tarjetasCfg());
const saldosHasta = mes => calcularSaldos(S.datos?.movimientos || [], AJ(), mes);
const fc = f => f ? `${+f.slice(8, 10)}/${+f.slice(5, 7)}` : '';
const esAhorroMov = m => m.tipo === 'ahorro' || m.tipo === 'retiro';
// pesos que salen (ahorro) o entran (retiro) de la cuenta en pesos con este movimiento de ahorros
const pesosDe = m => m.cuenta === 'USD' ? 0 : m.moneda === 'ARS' ? (Number(m.monto) || 0) : (Number(m.pesos) || 0);
const sumaPesos = arr => arr.reduce((a, m) => a + pesosDe(m), 0);
const flecha = '<svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>';

function infoTarjetas() {
  const aj = AJ(), movs = S.datos?.movimientos || [];
  return tarjetasActivas(movs, aj).map(card => calcularTarjeta(movs, card, hoyISO(), aj.tarjetas));
}

/** Cotización para pasar dólares a pesos: la de Ajustes o la de tu última compra de dólares. */
function cotizacion() {
  const ref = AJ().cotizacionReferencia;
  if (ref) return { v: ref, origen: 'la que cargaste en Ajustes' };
  const ult = (S.datos?.movimientos || []).filter(m => m.tipo === 'ahorro' && m.moneda === 'USD' && m.cuenta !== 'USD' && m.pesos > 0)
    .sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
  return ult ? { v: ult.pesos / ult.monto, origen: `la de tu última compra (${fc(ult.fecha)})` } : null;
}

/** Tarjetita de una tarjeta de crédito para el Resumen. */

function miniAhorros(sal) {
  const aj = AJ();

  if (aj.ahorroMonedas.includes('USD') || sal.ahorroUSD) partes.push(plata(sal.ahorroUSD, 'USD'));
  if (aj.ahorroMonedas.includes('ARS') || sal.ahorroARS) partes.push(plata(sal.ahorroARS));

    return;

  v.innerHTML = `
  <div class="grid">
    <div class="card hero">
      <div class="lbl">${heroLbl}</div>
      <div class="big num" ${heroSub ? 'style="margin-bottom:4px"' : ''}>${plata(base)}</div>

      <div class="fila">

      <div class="card span2">
        <h3>Saldo de la cuenta <small style="font-weight:500">a fin de cada mes</small></h3>
        <div class="chart-box"><canvas id="gUSD"></canvas></div>
      </div>
    </div>
  </div>`;
  const meses = [...Array(12)].map((_, i) => moverMes(S.mes, i - 11));
  dibujarBarras('#gUSD', meses, [{ label: 'Cuenta en dólares', color: '--navy', data: meses.map(me => saldosHasta(me).usd) }], 'USD', false);
}

/* ---------------- Ahorros ---------------- */
function renderAhorros() {
  const aj = AJ();
  const sal = saldosHasta(S.mes);
  const monedas = aj.ahorroMonedas.slice();
  if (sal.ahorroUSD && !monedas.includes('USD')) monedas.push('USD');
  if (sal.ahorroARS && !monedas.includes('ARS')) monedas.push('ARS');
  const cot = cotizacion();
  const verEn = monedas.includes(S.verAhorroEn) ? S.verAhorroEn : (monedas.includes('USD') ? 'USD' : 'ARS');
  const total = (s, en) => en === 'USD' ? s.ahorroUSD + (cot ? s.ahorroARS / cot.v : 0) : s.ahorroARS + (cot ? s.ahorroUSD * cot.v : 0);
  const puedeConvertir = monedas.length > 1 && cot;
  const totalAhora = monedas.length > 1 ? total(sal, verEn) : (verEn === 'USD' ? sal.ahorroUSD : sal.ahorroARS);

  const movs = movsDelMes().filter(esAhorroMov);
  const netoMes = mon => suma(movs.filter(m => m.moneda === mon && m.tipo === 'ahorro')) - suma(movs.filter(m => m.moneda === mon && m.tipo === 'retiro'));
  const anio = S.mes.slice(0, 4);
  const delAnio = (S.datos.movimientos || []).filter(m => esAhorroMov(m) && m.mes.startsWith(anio) && m.mes <= S.mes);
  const netoAnio = mon => suma(delAnio.filter(m => m.moneda === mon && m.tipo === 'ahorro')) - suma(delAnio.filter(m => m.moneda === mon && m.tipo === 'retiro'));
  const compras = movs.filter(m => m.tipo === 'ahorro' && m.moneda === 'USD' && m.cuenta !== 'USD' && m.pesos > 0);
  const cotProm = suma(compras) ? sumaPesos(compras) / suma(compras) : 0;
  const v = $('#v-ahorros');

  const nada = !(S.datos.movimientos || []).some(esAhorroMov) && !aj.saldoInicialAhorroUSD && !aj.saldoInicialAhorroARS;
  if (nada) {
    v.innerHTML = `<div class="card vacio"><div class="em">🐷</div><b>Todavía no cargaste ahorros</b>
      Tocá <b style="display:inline;color:inherit">+</b> para sumar plata a tus ahorros, o decile a Siri <i>"${monedas.includes('USD') ? 'compré 200 dólares a 1450' : 'ahorré 50 mil pesos'}"</i>.
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn prim" id="ahNuevo">🐷 Agregar a ahorros</button><button class="btn" data-ir="ajustes">Cargar lo que ya tengo</button></div></div>`;
    $('#ahNuevo').onclick = () => abrirMovimiento(null, 'ahorro');
    return;
  }

  const bolsillo = (mon) => `
    <div class="card bolsillo">
      <span class="em">${mon === 'USD' ? '🇺🇸' : '🇦🇷'}</span>
      <span><small>Ahorros en ${mon === 'USD' ? 'dólares' : 'pesos'}</small><b class="num">${plata(mon === 'USD' ? sal.ahorroUSD : sal.ahorroARS, mon)}</b>
      <small style="font-weight:500">${netoMes(mon) ? (netoMes(mon) > 0 ? '+' : '−') + plata(Math.abs(netoMes(mon)), mon) + ' este mes' : 'Sin movimientos este mes'}</small></span>
    </div>`;

  v.innerHTML = `
  <div class="grid">
    <div class="card hero dorado">
      <div class="lbl">${S.mes === mesActual() ? 'Tenés ahorrado' : 'Tenías ahorrado al cierre de ' + esc(labelMes(S.mes).split(' ')[0].toLowerCase())}</div>
      <div class="big num" style="margin-bottom:4px">${plata(totalAhora, verEn)}</div>
      <div class="sub">${monedas.length > 1 ? (cot ? `Todo junto, pasado a ${verEn === 'USD' ? 'dólares' : 'pesos'} a ${plata(cot.v)} por dólar (${esc(cot.origen)})` : 'Para sumar pesos y dólares necesito una cotización: cargala en Ajustes.') : `Todo en ${verEn === 'USD' ? 'dólares' : 'pesos'}`}</div>
      ${puedeConvertir ? `<div class="seg seg-claro" style="margin:0 0 14px">
        <button data-verahorro="USD" class="${verEn === 'USD' ? 'on' : ''}">Ver en dólares</button>
        <button data-verahorro="ARS" class="${verEn === 'ARS' ? 'on' : ''}">Ver en pesos</button></div>` : ''}
      <div class="fila">
        <button class="pill boton" id="ahPoner">🐷 Agregar<b>Sumar a ahorros</b></button>
        <button class="pill boton" id="ahSacar">↩︎ Sacar<b>Usar ahorros</b></button>
      </div>
    </div>

    ${monedas.length > 1 ? `<div class="minis">${monedas.map(bolsillo).join('')}</div>` : ''}

    <div class="stats">
      ${monedas.map(mon => `<div class="card stat"><div class="lbl">Ahorrado este mes${monedas.length > 1 ? (mon === 'USD' ? ' (US$)' : ' ($)') : ''}</div><div class="v num ${netoMes(mon) < 0 ? 'c-bordo' : 'c-green'}">${netoMes(mon) < 0 ? '−' : '+'}${plata(Math.abs(netoMes(mon)), mon)}</div><div class="s">lo que pusiste menos lo que sacaste</div></div>`).join('')}
      ${monedas.map(mon => `<div class="card stat"><div class="lbl">Ahorrado en ${anio}${monedas.length > 1 ? (mon === 'USD' ? ' (US$)' : ' ($)') : ''}</div><div class="v num c-navy">${plata(netoAnio(mon), mon)}</div><div class="s">en lo que va del año</div></div>`).join('')}
      ${monedas.includes('USD') ? `<div class="card stat"><div class="lbl">Cotización promedio</div><div class="v num c-gold">${cotProm ? plata(cotProm) : '—'}</div><div class="s">${cotProm ? 'pagaste por dólar este mes' : 'no compraste dólares este mes'}</div></div>
      <div class="card stat"><div class="lbl">Pesos que pasaste a dólares</div><div class="v num">${plata(sumaPesos(compras))}</div><div class="s">este mes</div></div>` : ''}
    </div>

    <div class="grid g2">
      <div class="card span2">
        <h3>Cómo crecen tus ahorros <small style="font-weight:500">a fin de cada mes</small></h3>
        <div class="chart-box"><canvas id="gAhorro"></canvas></div>
      </div>
      <div class="card span2">
        <h3>Movimientos de ahorros en ${esc(labelMes(S.mes).split(' ')[0].toLowerCase())}</h3>
        ${movs.length ? `<div class="lista" style="border:0;box-shadow:none">${movs.sort((a, b) => b.fecha.localeCompare(a.fecha)).map(filaMov).join('')}</div>` : '<div class="vacio" style="padding:14px">No moviste tus ahorros este mes.</div>'}
      </div>
    </div>
  </div>`;
  $('#ahPoner').onclick = () => abrirMovimiento(null, 'ahorro');
  $('#ahSacar').onclick = () => abrirMovimiento(null, 'retiro');

  const meses = [...Array(12)].map((_, i) => moverMes(S.mes, i - 11));
  const series = monedas.length > 1 && cot
    ? [{ label: 'Ahorros (en ' + (verEn === 'USD' ? 'dólares' : 'pesos') + ')', color: '--gold', data: meses.map(me => total(saldosHasta(me), verEn)) }]
    : monedas.map(mon => ({ label: mon === 'USD' ? 'En dólares' : 'En pesos', color: mon === 'USD' ? '--gold' : '--green', data: meses.map(me => mon === 'USD' ? saldosHasta(me).ahorroUSD : saldosHasta(me).ahorroARS) }));
  if (series.length === 1) dibujarBarras('#gAhorro', meses, series, monedas.length > 1 ? verEn : monedas[0], false);
  else { const s = series.find(x => x.label === 'En dólares') || series[0]; dibujarBarras('#gAhorro', meses, [s], s.label === 'En dólares' ? 'USD' : 'ARS', true); } // sin cotización no puedo sumarlas
}

/* ---------------- Gráficos ---------------- */
function agrupar(lista, campo) {
  const m = {};
  lista.forEach(x => { const k = x[campo] || 'Sin especificar'; m[k] = (m[k] || 0) + (Number(x.monto) || 0); });
  return Object.entries(m).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v);
}

function colorVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function prepararChart() {
  if (!window.Chart) return false;
  Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";
  Chart.defaults.color = colorVar('--muted');
  return true;
}

function dibujarDona(porCat, total) {
  const dona = $('#gDona');
  if (!dona || !porCat.length || !prepararChart()) return;
  S.graficos.push(new Chart(dona, {
    type: 'doughnut',
    data: { labels: porCat.map(c => c.k), datasets: [{ data: porCat.map(c => c.v), backgroundColor: porCat.map(c => catInfo(c.k).color), borderColor: colorVar('--surface'), borderWidth: 3, hoverOffset: 6 }] },
    options: { cutout: '72%', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${plata(c.raw)} (${Math.round(c.raw / total * 100)}%)` } } } }
  }));
}

function dibujarBarras(sel, meses, series, moneda, leyenda = true) {
  const cv = $(sel);
  if (!cv || !prepararChart()) return;
  const corto = v => moneda === 'USD' ? 'US$' + (Math.abs(v) >= 1e3 ? (v / 1e3).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' mil' : v)
    : Math.abs(v) >= 1e6 ? '$' + (v / 1e6).toLocaleString('es-AR') + ' M' : Math.abs(v) >= 1e3 ? '$' + Math.round(v / 1e3) + ' mil' : '$' + v;
  S.graficos.push(new Chart(cv, {
    type: 'bar',
    data: { labels: meses.map(mesCorto), datasets: series.map(s => ({ label: s.label, data: s.data, backgroundColor: colorVar(s.color), borderRadius: 6, maxBarThickness: 22 })) },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: leyenda, position: 'bottom', labels: { usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 8, padding: 16 } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${plata(c.raw, moneda)}` } } },
      scales: {
        x: { grid: { display: false }, border: { display: false } },
        y: { grid: { color: colorVar('--line') }, border: { display: false }, ticks: { maxTicksLimit: 5, callback: corto } }
      }
    }
  }));
}

/* ---------------- Movimientos ---------------- */
function renderMovimientos() {
  const v = $('#v-movimientos');
  v.innerHTML = `
    <form class="rapido" id="fRapido">
      <input id="txtRapido" autocomplete="off" placeholder='Escribí como le hablarías a Siri…' enterkeyhint="send">
      <button aria-label="Anotar"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <div class="ayuda">Ej: "gasté 8500 en el súper con débito" · "cobré 300 mil de freelance"</div>
    <div class="buscador"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="busca" placeholder="Buscar" value="${esc(S.busqueda)}"></div>
    <div class="chips">${[['todos', 'Todos'], ['gasto', 'Gastos'], ['ingreso', 'Ingresos'], ['ahorro', 'Ahorros'], ['dolares', 'En dólares'], ['tarjeta', 'Tarjeta'], ['fijo', 'Fijos'], ['variable', 'Variables']].map(([k, t]) => `<button class="chip ${S.filtro === k ? 'on' : ''}" data-filtro="${k}">${t}</button>`).join('')}</div>
    <div id="listaMovs"></div>`;
  renderListaMovs();
}

function renderListaMovs() {
  const q = S.busqueda.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let lista = movsDelMes().filter(m => {
    if (S.filtro === 'gasto' || S.filtro === 'ingreso') { if (m.tipo !== S.filtro) return false; }
    if (S.filtro === 'ahorro' && m.tipo !== 'ahorro' && m.tipo !== 'retiro') return false;
    if (S.filtro === 'dolares' && (m.moneda !== 'USD' || esAhorroMov(m))) return false;
    if (S.filtro === 'tarjeta' && !vaATarjeta(m) && m.tipo !== 'pagoTarjeta') return false;
    if (S.filtro === 'fijo' && !m.idFijo) return false;
    if (S.filtro === 'variable' && (m.idFijo || m.tipo !== 'gasto')) return false;
    if (q && !`${m.descripcion} ${m.categoria} ${m.medio}`.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)) return false;
    return true;
  }).sort((a, b) => b.fecha.localeCompare(a.fecha) || String(b.creado).localeCompare(String(a.creado)));

  const cont = $('#listaMovs');
  if (!lista.length) { cont.innerHTML = `<div class="card vacio"><div class="em">🧾</div><b>No hay movimientos</b>${S.busqueda || S.filtro !== 'todos' ? 'Probá con otro filtro.' : 'Cargá el primero con el botón +.'}</div>`; return; }

  const dias = {};
  lista.forEach(m => (dias[m.fecha] = dias[m.fecha] || []).push(m));
  const hoy = hoyISO(), ayer = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
  cont.innerHTML = Object.entries(dias).map(([f, ms]) => {
    const d = new Date(+f.slice(0, 4), +f.slice(5, 7) - 1, +f.slice(8, 10));
    const titulo = f === hoy ? 'Hoy' : f === ayer ? 'Ayer' : d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    const neto = suma(ms.filter(m => m.tipo === 'gasto' && m.moneda !== 'USD'));
    return `<div class="dia"><div class="dia-tit"><span>${esc(titulo)}</span><span class="num">${neto ? '−' + plata(neto) : ''}</span></div><div class="lista">${ms.map(filaMov).join('')}</div></div>`;
  }).join('');
}

function filaMov(m) {
  const c = catInfo(m.categoria);
  if (m.tipo === 'pagoTarjeta') {
    return `<button class="mov" data-mov="${esc(m.id)}">
      <span class="em" style="background:var(--bordo-soft)">💳</span>
      <span style="min-width:0"><b>Pagaste la tarjeta</b><small>${m.origen === 'siri' ? '<span class="tag siri">SIRI</span> ' : ''}${esc(m.medio && !/^cr[eé]dito$/i.test(m.medio) ? m.medio + ' · ' : '')}Pago del resumen</small></span>
      <span class="mt num neg">−${plata(m.monto)}</span>
    </button>`;
  }
  if (esAhorroMov(m)) {
    const ah = m.tipo === 'ahorro', conPesos = m.moneda === 'USD' && m.cuenta !== 'USD';
    const titulo = ah ? (conPesos ? 'Compraste dólares' : 'A ahorros') : (conPesos ? 'Vendiste dólares' : 'Sacaste de ahorros');
    const det = [conPesos && m.pesos ? plata(m.pesos) + ' · a ' + plata(m.pesos / m.monto) + ' c/u' : '',
      m.cuenta === 'USD' ? (ah ? 'desde la cuenta en dólares' : 'a la cuenta en dólares') : '',
      m.moneda === 'ARS' ? (ah ? 'desde tu cuenta en pesos' : 'a tu cuenta en pesos') : ''].filter(Boolean).map(esc).join(' · ');
    return `<button class="mov" data-mov="${esc(m.id)}">
      <span class="em" style="background:${ah ? 'var(--gold-soft)' : 'var(--navy-soft)'}">${ah ? '🐷' : '↩︎'}</span>
      <span style="min-width:0"><b>${titulo}</b><small>${m.origen === 'siri' ? '<span class="tag siri">SIRI</span> ' : ''}${det || 'Ahorros'}</small></span>
      <span class="mt num ${ah ? 'ahorro' : 'neg'}">${ah ? '+' : '−'}${plata(m.monto, m.moneda)}</span>
    </button>`;
  }
  const extra = [m.categoria, m.medio !== 'Sin especificar' ? m.medio : '', m.cuotas ? m.cuotas + ' cuotas' : ''].filter(Boolean).map(esc).join(' · ');
  const tags = (vaATarjeta(m) ? '<span class="tag tarj">TARJETA</span> ' : '') + (m.idFijo ? '<span class="tag fijo">FIJO</span> ' : '') + (m.origen === 'siri' ? '<span class="tag siri">SIRI</span> ' : '') + (m.origen === 'débito automático' ? '<span class="tag auto">AUTO</span> ' : '');
  return `<button class="mov" data-mov="${esc(m.id)}">
    <span class="em" style="background:${fondo(c.color)}">${esc(c.emoji || '•')}</span>
    <span style="min-width:0"><b>${esc(m.descripcion || m.categoria)}</b><small>${tags}${extra}</small></span>
    <span class="mt num ${m.tipo === 'ingreso' ? 'pos' : 'neg'}">${m.tipo === 'ingreso' ? '+' : '−'}${plata(m.monto, m.moneda)}</span>
  </button>`;
}

/* ---------------- Fijos ---------------- */
function renderFijos() {
  const est = estadoFijos();
  const inactivos = (S.datos.fijos || []).filter(f => !f.activo);
  const grupo = mon => {
    const e = est.filter(x => x.f.moneda === mon);
    return { e, total: suma(e.map(x => x.pago || x.f)), pagado: suma(e.filter(x => x.pago).map(x => x.pago)) };
  };
  const ars = grupo('ARS'), usd = grupo('USD');
  const barra = (g, mon, color) => g.e.length ? `<div class="grupo-mon"><div><small>${mon === 'USD' ? '🇺🇸 En dólares' : '🇦🇷 En pesos'}</small><div class="num" style="font-weight:700">${plata(g.pagado, mon)} <span style="color:var(--muted);font-weight:500">de ${plata(g.total, mon)}</span></div><div class="prog"><span style="width:${g.total ? g.pagado / g.total * 100 : 0}%;background:${color}"></span></div></div></div>` : '';
  const seccion = (g, titulo) => g.e.length ? `<div class="dia-tit" style="margin-top:14px;text-transform:none"><span>${titulo}</span><span>${g.e.filter(x => x.pago).length} de ${g.e.length} pagados</span></div><div class="lista">${g.e.map(filaFijo).join('')}</div>` : '';
  $('#v-fijos').innerHTML = `
    <div class="card">
      <div class="fijos-head" style="margin-bottom:0">
        <div><h3 style="margin:0">Pagaste ${est.filter(e => e.pago).length} de ${est.length} este mes</h3></div>
        <button class="btn" id="nuevoFijo" style="padding:10px 14px"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
      </div>
      ${barra(ars, 'ARS', 'var(--green)')}${barra(usd, 'USD', 'var(--navy)')}
    </div>
    ${est.length ? seccion(ars, 'En pesos') + seccion(usd, 'En dólares') : `<div class="card vacio" style="margin-top:12px"><div class="em">📅</div><b>Todavía no cargaste gastos fijos</b>Alquiler, expensas, luz, internet, suscripciones (en pesos o en dólares)… Cargalos una vez y cada mes vas tildando lo que pagás.<div style="margin-top:14px"><button class="btn prim" id="nuevoFijo2">Agregar mi primer fijo</button></div></div>`}
    ${inactivos.length ? `<div class="dia-tit" style="margin-top:18px"><span>Pausados</span></div><div class="lista inactivo">${inactivos.map(f => `<button class="fijo" style="width:100%;grid-template-columns:1fr auto" data-editfijo="${esc(f.id)}"><span class="mid"><b>${esc(f.nombre)}</b><small>Vence el ${f.dia}</small></span><span class="der"><span class="mt num">${plata(f.monto, f.moneda)}</span></span></button>`).join('')}</div>` : ''}
    <p class="ayuda" style="margin-top:14px">Tocá el círculo para marcar como pagado. Los que tienen débito automático se marcan solos el día del vencimiento.</p>`;
}

function filaFijo(e) {
  const { f, pago, dia, estado } = e;
  let est = '';
  if (pago) est = `<span class="est pagado">Pagado ${+pago.fecha.slice(8, 10)}/${+pago.fecha.slice(5, 7)}</span>`;
  else if (f.debitoAutomatico) est = `<span class="est ${estado === 'vencido' ? 'vencido' : 'auto'}">${estado === 'vencido' ? 'Revisar débito' : 'Se debita el ' + dia}</span>`;
  else est = `<span class="est ${estado}">${estado === 'vencido' ? 'Vencido' : 'Pendiente'}</span>`;
  return `<div class="fijo ${estado}">
    <button class="check" data-pagar="${esc(f.id)}" aria-label="${pago ? 'Desmarcar' : 'Marcar como pagado'} ${esc(f.nombre)}"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="mid" data-editfijo="${esc(f.id)}">
      <b>${esc(f.nombre)}</b>
      <small>Vence el ${dia}${f.medio && f.medio !== 'Sin especificar' ? ' · ' + esc(f.medio) : ''}</small>
      ${f.debitoAutomatico ? '<div class="badges"><span class="tag fijo">DÉBITO AUTOMÁTICO</span></div>' : ''}
    </button>
    <button class="der" ${pago ? `data-mov="${esc(pago.id)}"` : `data-editfijo="${esc(f.id)}"`}>
      <span class="mt num">${plata(pago ? pago.monto : f.monto, f.moneda)}</span>${est}
    </button>
  </div>`;
}

async function alternarPago(idFijo) {
  const e = estadoFijos().find(x => x.f.id === idFijo);
  if (!e) return;
  if (e.pago) {
    if (!confirm(`¿Desmarcar "${e.f.nombre}"? Se borra el pago registrado de este mes.`)) return;
    return hacer('despagarFijo', { idFijo, mes: S.mes }, 'Desmarcado');
  }
  if (!e.f.monto) return abrirPagoFijo({ ...e.f });
  await hacer('pagarFijo', { idFijo, mes: S.mes, monto: e.f.monto }, `${e.f.nombre} pagado ✓ Tocá el monto si fue distinto.`);
}

function abrirPagoFijo(f) {
  abrirHoja(`
    <h2>Pagar ${esc(f.nombre)}</h2>
    <label class="campo"><span>¿Cuánto pagaste? (${f.moneda === 'USD' ? 'en dólares' : 'en pesos'})</span><input class="monto-input num" id="pfMonto" inputmode="decimal" placeholder="${f.moneda === 'USD' ? 'US$ 0' : '$0'}" value="${f.monto || ''}"></label>
    <div class="acciones"><button class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="pfOk">Marcar pagado</button></div>`);
  $('#pfMonto').focus();
  $('#pfOk').onclick = async () => {
    const monto = leerMonto($('#pfMonto').value);
    if (!monto) return toast('Poné el monto', true);
    cerrarHoja(); await hacer('pagarFijo', { idFijo: f.id, mes: S.mes, monto }, `${f.nombre} pagado ✓`);
  };
}

/* ---------------- Formularios ---------------- */
function abrirHoja(html) {
  $('#hoja').innerHTML = '<div class="asa"></div>' + html;
  $('#capa').classList.add('on');
  $$('[data-cerrar]', $('#hoja')).forEach(b => b.onclick = cerrarHoja);
}
function cerrarHoja() { $('#capa').classList.remove('on'); }

function opciones(lista, sel) { return lista.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join(''); }

function infoDeTarjeta(id) { return infoTarjetas().find(t => String(t.card.id) === String(id)) || infoTarjetas()[0]; }

function abrirTarjeta(id) {
  const tj = infoDeTarjeta(id);
  if (!tj) return;
  if (tj.conCiclos) return abrirTarjetaCiclos(tj);
  const item = m => `<div class="tj-item"><span><b>${esc(m.descripcion)}</b><small>${fc(m.fecha)}${m.n > 1 ? ` · cuota ${m.cuotaNro} de ${m.n} (total ${plata(m.monto)})` : ''}</small></span><span class="num" style="font-weight:600">${plata(m.monto / m.n)}</span></div>`;
  abrirHoja(`
    <h2>💳 ${esc(tj.nombre)}</h2>
    <div class="tj-head">
      <small>Próximo pago (estimado)</small>
      <b class="num">${plata(tj.proximo)}</b>
      <p>${tj.deuda > tj.proximo + 0.5 ? `En total debés <strong>${plata(tj.deuda)}</strong>, contando las cuotas que vienen. ` : ''}${tj.ultimoPago ? `Último pago: ${plata(tj.ultimoPago.monto)} el ${fc(tj.ultimoPago.fecha)}.` : 'Todavía no registraste ningún pago.'}</p>
    </div>
    <button class="btn prim full" id="tjPagar" ${tj.deuda > 0.5 ? '' : 'disabled'}>Ya pagué la tarjeta</button>
    <div class="tj-tit" style="margin-top:16px">${tj.ultimoPago ? 'Compras desde el último pago' : 'Compras con crédito'}</div>
    ${tj.nuevos.length ? `<div class="tj-lista">${tj.nuevos.sort((a, b) => b.fecha.localeCompare(a.fecha)).map(item).join('')}</div>` : '<p class="ayuda" style="margin:6px 0 14px">No hay compras nuevas con crédito.</p>'}
    ${tj.cuotasViejas.length ? `<div class="tj-tit">Cuotas que siguen</div><div class="tj-lista">${tj.cuotasViejas.map(item).join('')}</div>` : ''}
    <div class="nota">Cargá el día de cierre y de vencimiento para que la app separe cada resumen como el banco.</div>
    <button class="btn full" id="tjConfig">⚙️ Configurar esta tarjeta</button>`);
  if ($('#tjPagar')) $('#tjPagar').onclick = () => abrirPagoTarjeta(null, tj.proximo || tj.deuda, tj.nombre);
  $('#tjConfig').onclick = () => abrirFormTarjeta(tarjetasCfg().find(c => c.id === tj.card.id) || { nombre: tj.nombre });
}

function abrirTarjetaCiclos(tj) {
  const nombreMes = ciclo => new Date(+ciclo.slice(0, 4), +ciclo.slice(5, 7) - 1, 1).toLocaleDateString('es-AR', { month: 'long' });
  const item = it => `<div class="tj-item"><span><b>${esc(it.descripcion)}</b><small>${it.inicial ? 'Cargado en Ajustes' : fc(it.fecha)}${it.n > 1 ? ` · cuota ${it.cuotaNro} de ${it.n} (total ${plata(it.monto)})` : ''}</small></span><span class="num" style="font-weight:600">${plata(it.monto / it.n)}</span></div>`;
  const items = l => `<div class="tj-lista">${l.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).map(item).join('')}</div>`;
  const cerradosItems = tj.cerrados.flatMap(c => c.items);
  const pagadoCerrado = tj.cerrados.reduce((a, c) => a + c.pagado, 0);
  const a = tj.actual;
  abrirHoja(`
    <h2>💳 ${esc(tj.nombre)}</h2>
    ${tj.aPagar > 0.5 ? `
    <div class="tj-head">
      <small>${tj.vencido ? '⚠️ Venció el ' + fc(tj.venceCerrado) : 'A pagar · vence el ' + fc(tj.venceCerrado)}</small>
      <b class="num">${plata(tj.aPagar)}</b>
      <p>Es el resumen que ya cerró${tj.cerrados.length === 1 ? ' el ' + fc(tj.cerrados[0].cierra) : ''}.${pagadoCerrado > 0.5 ? ` Ya pagaste ${plata(pagadoCerrado)} de este resumen.` : ''}</p>
    </div>
    <button class="btn prim full" id="tjPagar">Ya pagué la tarjeta</button>
    <div class="tj-tit" style="margin-top:16px">Qué tiene este resumen</div>${items(cerradosItems)}` : ''}

    <div class="tj-head" style="background:var(--surface-2)${tj.aPagar > 0.5 ? ';margin-top:6px' : ''}">
      <small style="color:var(--muted)">Resumen en curso · cierra el ${fc(a.cierra)} · vence el ${fc(a.vence)}</small>
      <b class="num" style="color:var(--ink)">${plata(a.pendiente)}</b>
      <p>${tj.aPagar > 0.5 ? 'Lo que vayas comprando con esta tarjeta hasta el cierre se suma acá.' : 'No tenés ningún resumen cerrado sin pagar. Lo que compres hasta el cierre se suma acá.'}${a.pagado > 0.5 ? ` Ya adelantaste ${plata(a.pagado)}.` : ''}</p>
    </div>
    ${tj.aPagar > 0.5 ? '' : `<button class="btn prim full" id="tjPagar" ${a.pendiente > 0.5 ? '' : 'disabled'}>Ya pagué la tarjeta</button>`}
    ${a.items.length ? `<div class="tj-tit" style="margin-top:16px">Compras del resumen en curso</div>${items(a.items)}` : '<p class="ayuda" style="margin:12px 0 14px">Todavía no hay compras en este resumen.</p>'}

    ${tj.futuros.length ? `<div class="tj-tit">Cuotas de los próximos resúmenes</div><div class="tj-lista">${tj.futuros.map(c => `<div class="tj-item"><span><b>Resumen de ${esc(nombreMes(c.ciclo))}</b><small>vence el ${fc(c.vence)}</small></span><span class="num" style="font-weight:600">${plata(c.pendiente)}</span></div>`).join('')}</div>` : ''}
    <p class="ayuda" style="margin:0">En total debés <b>${plata(tj.deuda)}</b>${tj.enCuotasFuturas > 0.5 ? ', contando cuotas futuras' : ''}. Lo que pagues se descuenta de tu plata y se aplica primero al resumen más viejo.</p>
    <button class="btn full" id="tjConfig" style="margin-top:14px">⚙️ Cambiar cierre, vencimiento o saldo</button>`);
  if ($('#tjPagar')) $('#tjPagar').onclick = () => abrirPagoTarjeta(null, tj.proximo, tj.nombre);
  $('#tjConfig').onclick = () => abrirFormTarjeta(tarjetasCfg().find(c => c.id === tj.card.id));
}

function abrirPagoTarjeta(mov, sugerido, tarjeta) {
  const edit = !!mov;
  const tarjetas = tarjetasCfg().map(c => c.nombre);
  if (!tarjetas.length) tarjetas.push('Crédito');
  const sel = edit ? mov.medio : (tarjeta || tarjetas[0]);
  const num = v => v ? (+v).toLocaleString('es-AR', { maximumFractionDigits: 2 }) : '';
  abrirHoja(`
    <h2>${edit ? 'Editar pago de tarjeta' : 'Pagué la tarjeta'}</h2>
    <label class="campo"><span>¿Cuánto pagaste?</span><input class="monto-input num" id="ptMonto" inputmode="decimal" placeholder="$ 0" value="${num(edit ? mov.monto : Math.round(sugerido || 0))}"></label>
    ${!edit && sugerido ? '<p class="calc">Te sugerimos el estimado. Si el resumen dice otra cosa, cambialo.</p>' : ''}
    <div class="dos">
      <label class="campo"><span>Fecha</span><input id="ptFecha" type="date" value="${esc(edit ? mov.fecha : hoyISO())}"></label>
      ${tarjetas.length > 1 ? `<label class="campo"><span>Tarjeta</span><select id="ptTarjeta">${opciones(tarjetas, sel)}</select></label>` : '<span></span>'}
    </div>
    <div class="acciones">${edit ? '<button class="btn peligro" id="ptBorrar">Borrar</button>' : '<button class="btn" data-cerrar>Cancelar</button>'}<button class="btn prim" id="ptOk">Guardar pago</button></div>`);
  if (!edit) setTimeout(() => $('#ptMonto').select(), 250);
  $('#ptOk').onclick = async () => {
    const monto = leerMonto($('#ptMonto').value);
    if (!monto) return toast('Poné cuánto pagaste', true);
    const datos = { tipo: 'pagoTarjeta', monto, fecha: $('#ptFecha').value || hoyISO(), medio: $('#ptTarjeta') ? $('#ptTarjeta').value : sel, descripcion: 'Pago de tarjeta', categoria: 'Pago de tarjeta', moneda: 'ARS' };
    $('#ptOk').disabled = true;
    try { await hacer(edit ? 'editar' : 'agregar', edit ? { id: mov.id, movimiento: datos } : { movimiento: datos }, edit ? 'Actualizado' : 'Pago de tarjeta guardado ✓ Se descontó de tu plata'); cerrarHoja(); }
    catch (e) { $('#ptOk').disabled = false; }
  };
  if (edit) $('#ptBorrar').onclick = async () => {
    if (!confirm('¿Borrar este pago de tarjeta?')) return;
    cerrarHoja(); await hacer('borrar', { id: mov.id }, 'Borrado');
  };
}

function abrirMovimiento(mov, tipoInicial) {
  if (mov && mov.tipo === 'pagoTarjeta') return abrirPagoTarjeta(mov);
  const aj = AJ();
  const edit = !!mov;
  const porDefecto = tipoInicial || (S.vista === 'ahorros' ? 'ahorro' : 'gasto');
  const m = mov || { tipo: porDefecto, moneda: 'ARS', fecha: S.mes === mesActual() ? hoyISO() : S.mes + '-01', medio: 'Sin especificar', categoria: '' };
  const esFijo = !!m.idFijo;
  const num = v => v ? (+v).toLocaleString('es-AR', { maximumFractionDigits: 2 }) : '';
  const cambioIni = !!mov && esAhorroMov(mov); // estás editando un movimiento de ahorros
  // monedas de ahorro disponibles (si estás editando uno viejo en otra moneda, también aparece)
  const monAh = aj.ahorroMonedas.slice();
  if (cambioIni && !monAh.includes(m.moneda)) monAh.push(m.moneda);
  let monAhorro = cambioIni ? m.moneda : (monAh.includes('USD') ? 'USD' : monAh[0]);
  let desdeUSD = cambioIni && m.cuenta === 'USD';
  abrirHoja(`
    <h2>${edit ? 'Editar movimiento' : 'Nuevo movimiento'}</h2>
    ${esFijo ? '<div class="nota">📅 Es el pago de un gasto fijo. Si lo borrás, el fijo vuelve a quedar pendiente.</div>' : `
    <div class="seg cuatro" id="mTipo">
      <button type="button" data-v="gasto">Gasto</button><button type="button" data-v="ingreso">Ingreso</button>
      <button type="button" data-v="ahorro">🐷 A ahorros</button><button type="button" data-v="retiro">↩︎ Sacar de ahorros</button>
    </div>`}

    <div id="gNormal">
      <label class="campo"><span>Monto</span><input class="monto-input num" id="mMonto" inputmode="decimal" placeholder="0" value="${!cambioIni ? num(m.monto) : ''}"></label>
    </div>
    <div id="gCambio">
      <div class="seg" id="cMoneda" ${monAh.length > 1 ? '' : 'hidden'}><button type="button" data-v="USD">🇺🇸 En dólares</button><button type="button" data-v="ARS">🇦🇷 En pesos</button></div>
      <div class="seg" id="cOrigen" ${aj.cuentaUSD ? '' : 'hidden'}><button type="button" data-v="pesos"></button><button type="button" data-v="usd"></button></div>
      <div id="cUsdBox">
        <label class="campo"><span>Dólares</span><input class="monto-input num" id="cUsd" inputmode="decimal" placeholder="US$ 0" value="${cambioIni && m.moneda === 'USD' ? num(m.monto) : ''}"></label>
        <div class="dos" id="cPesosBox">
          <label class="campo"><span>Cotización (por dólar)</span><input class="num" id="cCot" inputmode="decimal" placeholder="$ 0" value="${m.pesos && m.monto && m.moneda === 'USD' ? num(m.pesos / m.monto) : ''}"></label>
          <label class="campo"><span>Total en pesos</span><input class="num" id="cPesos" inputmode="decimal" placeholder="$ 0" value="${m.moneda === 'USD' ? num(m.pesos) : ''}"></label>
        </div>
      </div>
      <div id="cArsBox"><label class="campo"><span>Pesos</span><input class="monto-input num" id="cArs" inputmode="decimal" placeholder="$ 0" value="${cambioIni && m.moneda === 'ARS' ? num(m.monto) : ''}"></label></div>
      <div class="calc" id="cTexto"></div>
    </div>

    <label class="campo" id="campoDesc"><span>Descripción</span><input id="mDesc" placeholder="Ej: Súper Coto" value="${esc(cambioIni ? '' : m.descripcion || '')}"></label>
    <div class="dos">
      <label class="campo" id="campoCat"><span>Categoría</span><select id="mCat"></select></label>
      <label class="campo" id="campoMedio"><span>Medio de pago</span><select id="mMedio">${opciones(medios(), m.medio)}</select></label>
    </div>
    <div class="dos">
      <label class="campo"><span>Fecha</span><input id="mFecha" type="date" value="${esc(m.fecha)}"></label>
      <label class="campo" id="campoMoneda"><span>Moneda</span><select id="mMoneda"><option value="ARS" ${m.moneda !== 'USD' ? 'selected' : ''}>Pesos</option><option value="USD" ${m.moneda === 'USD' ? 'selected' : ''}>Dólares</option></select></label>
    </div>
    <div class="nota" id="notaCredito" hidden>💳 Va a la tarjeta: se descuenta de tu plata cuando pagues el resumen.</div>
    <label class="campo" id="campoCuotas"><span>Cuotas</span><input id="mCuotas" type="number" min="1" max="48" inputmode="numeric" placeholder="1" value="${m.cuotas || ''}"></label>
    <div class="acciones">${edit ? '<button class="btn peligro" id="mBorrar">Borrar</button>' : '<button class="btn" data-cerrar>Cancelar</button>'}<button class="btn prim" id="mOk">Guardar</button></div>`);

  let tipo = m.tipo;
  const cambio = () => tipo === 'ahorro' || tipo === 'retiro';
  const conPesos = () => monAhorro === 'USD' && !desdeUSD; // compra/venta de dólares con pesos
  const llenarCats = () => {
    const lista = cats(tipo).map(c => c.nombre);
    $('#mCat').innerHTML = lista.map(n => { const c = catInfo(n); return `<option value="${esc(n)}" ${n === m.categoria ? 'selected' : ''}>${esc((c.emoji ? c.emoji + ' ' : '') + n)}</option>`; }).join('');
  };
  const calcular = (desde) => {
    if (!cambio()) return;
    if (monAhorro === 'ARS') {
      const p = leerMonto($('#cArs').value);
      $('#cTexto').innerHTML = p ? (tipo === 'ahorro' ? `Pasás <b>${plata(p)}</b> de tu cuenta a tus ahorros en pesos` : `Sacás <b>${plata(p)}</b> de tus ahorros y vuelve a tu cuenta en pesos`) : '';
      return;
    }
    const usd = leerMonto($('#cUsd').value), cot = leerMonto($('#cCot').value), pesos = leerMonto($('#cPesos').value);
    if (!conPesos()) { $('#cTexto').innerHTML = usd ? (tipo === 'ahorro' ? `Pasás <b>${plata(usd, 'USD')}</b> de la cuenta en dólares a tus ahorros` : `Pasás <b>${plata(usd, 'USD')}</b> de tus ahorros a la cuenta en dólares`) : ''; return; }
    if (desde === 'pesos' && usd) $('#cCot').value = pesos ? num(pesos / usd) : '';
    else if (desde && usd && cot) $('#cPesos').value = num(usd * cot);
    const p = leerMonto($('#cPesos').value);
    $('#cTexto').innerHTML = usd ? (tipo === 'ahorro' ? `Pasás <b>${plata(p)}</b> a <b>${plata(usd, 'USD')}</b> de ahorro` : `Vendés <b>${plata(usd, 'USD')}</b> de tus ahorros y recibís <b>${plata(p)}</b>`) : (tipo === 'ahorro' ? 'Poné los dólares que compraste y la cotización o el total en pesos.' : 'Poné los dólares que vendiste y la cotización o el total en pesos.');
  };
  const actualizar = () => {
    $$('#mTipo button').forEach(x => x.classList.toggle('on', x.dataset.v === tipo));
    const c = cambio();
    $('#gNormal').hidden = c; $('#gCambio').hidden = !c;
    $('#campoCat').hidden = c; $('#campoMoneda').hidden = c; $('#campoDesc').hidden = c;
    $('#campoMedio').hidden = c && (monAhorro === 'ARS' || desdeUSD);
    if (c) {
      if (monAhorro === 'ARS') desdeUSD = false;
      $$('#cMoneda button').forEach(x => x.classList.toggle('on', x.dataset.v === monAhorro));
      $('#cOrigen').hidden = !aj.cuentaUSD || monAhorro !== 'USD';
      const [b1, b2] = $$('#cOrigen button');
      b1.textContent = tipo === 'ahorro' ? '💵 Compré con pesos' : '💵 Los vendí (a pesos)';
      b2.textContent = tipo === 'ahorro' ? '🇺🇸 Desde mi cuenta en dólares' : '🇺🇸 A mi cuenta en dólares';
      b1.classList.toggle('on', !desdeUSD); b2.classList.toggle('on', desdeUSD);
      $('#cUsdBox').hidden = monAhorro !== 'USD'; $('#cArsBox').hidden = monAhorro !== 'ARS';
      $('#cPesosBox').hidden = !conPesos();
    }
    $('#campoCuotas').hidden = c || tipo !== 'gasto' || !esCredito($('#mMedio').value);
    $('#notaCredito').hidden = $('#campoCuotas').hidden || $('#mMoneda').value === 'USD';
    $('#mMonto').placeholder = $('#mMoneda').value === 'USD' ? 'US$ 0' : '$ 0';
    if (!c) llenarCats();
    calcular();
  };
  $('#cUsd').oninput = () => calcular('usd'); $('#cCot').oninput = () => calcular('cot'); $('#cPesos').oninput = () => calcular('pesos'); $('#cArs').oninput = () => calcular();
  $('#mMedio').onchange = actualizar;
  $('#mMoneda').onchange = () => {
    if ($('#mMoneda').value === 'USD' && $('#mMedio').value === 'Sin especificar' && medios().includes('Cuenta en dólares')) $('#mMedio').value = 'Cuenta en dólares';
    actualizar();
  };
  $$('#mTipo button').forEach(b => b.onclick = () => { tipo = b.dataset.v; actualizar(); });
  $$('#cMoneda button').forEach(b => b.onclick = () => { monAhorro = b.dataset.v; actualizar(); });
  $$('#cOrigen button').forEach(b => b.onclick = () => { desdeUSD = b.dataset.v === 'usd'; actualizar(); });
  actualizar();
  if (!edit) setTimeout(() => (cambio() ? (monAhorro === 'ARS' ? $('#cArs') : $('#cUsd')) : $('#mMonto')).focus(), 250);

  $('#mOk').onclick = async () => {
    let datos;
    const base = { tipo, medio: $('#mMedio').value, fecha: $('#mFecha').value || hoyISO() };
    if (cambio()) {
      const nombreCat = tipo === 'ahorro' ? 'Ahorro' : (conPesos() ? 'Venta de dólares' : 'Retiro de ahorros');
      if (monAhorro === 'ARS') {
        const p = leerMonto($('#cArs').value);
        if (!p) return toast('Poné cuántos pesos', true);
        datos = { ...base, medio: 'Sin especificar', monto: p, pesos: p, moneda: 'ARS', cuenta: 'ARS', descripcion: tipo === 'ahorro' ? 'Ahorro en pesos' : 'Saqué de ahorros', categoria: nombreCat, cuotas: '' };
      } else {
        const usd = leerMonto($('#cUsd').value);
        if (!usd) return toast('Poné cuántos dólares', true);
        datos = desdeUSD
          ? { ...base, medio: 'Cuenta en dólares', monto: usd, pesos: 0, moneda: 'USD', cuenta: 'USD', descripcion: tipo === 'ahorro' ? 'De la cuenta en dólares a ahorros' : 'De ahorros a la cuenta en dólares', categoria: nombreCat, cuotas: '' }
          : { ...base, monto: usd, pesos: leerMonto($('#cPesos').value), moneda: 'USD', cuenta: 'ARS', descripcion: tipo === 'ahorro' ? 'Compra de dólares' : 'Venta de dólares', categoria: nombreCat, cuotas: '' };
      }
    } else {
      const monto = leerMonto($('#mMonto').value);
      if (!monto) return toast('Poné un monto', true);
      datos = { ...base, monto, descripcion: $('#mDesc').value.trim(), categoria: $('#mCat').value, moneda: $('#mMoneda').value, cuotas: $('#campoCuotas').hidden ? '' : +$('#mCuotas').value || '', pesos: '', cuenta: '' };
    }
    $('#mOk').disabled = true;
    try { await hacer(edit ? 'editar' : 'agregar', edit ? { id: m.id, movimiento: datos } : { movimiento: datos }, edit ? 'Actualizado' : 'Guardado ✓'); cerrarHoja(); }
    catch (e) { $('#mOk').disabled = false; }
  };
  if (edit) $('#mBorrar').onclick = async () => {
    if (!confirm('¿Borrar este movimiento?')) return;
    cerrarHoja(); await hacer('borrar', { id: m.id }, 'Borrado');
  };
}

    <label class="campo"><span>Día de vencimiento</span><input id="fDia" type="number" min="1" max="31" inputmode="numeric" value="${f.dia || ''}"></label>

  if (!edit) setTimeout(() => $('#fNombre').focus(), 250);
  $('#fMoneda').onchange = () => { if ($('#fMoneda').value === 'USD' && $('#fMedio').value === 'Sin especificar' && medios().includes('Cuenta en dólares')) $('#fMedio').value = 'Cuenta en dólares'; };
  $('#fOk').onclick = async () => {
    const nombre = $('#fNombre').value.trim();
    if (!nombre) return toast('Ponele un nombre', true);
    const datos = { id: f.id, nombre, monto: leerMonto($('#fMonto').value), dia: Math.min(31, Math.max(1, +$('#fDia').value || 1)), categoria: $('#fCat').value, medio: $('#fMedio').value, debitoAutomatico: $('#fAuto').checked, activo: $('#fActivo').checked, notas: $('#fNotas').value.trim(), moneda: $('#fMoneda').value };
    $('#fOk').disabled = true;
    try { await hacer('guardarFijo', { fijo: datos }, 'Gasto fijo guardado'); cerrarHoja(); } catch (e) { $('#fOk').disabled = false; }
  };
  if (edit) $('#fBorrar').onclick = async () => {
    if (!confirm(`¿Eliminar "${f.nombre}"? Los pagos que ya registraste quedan en el historial.`)) return;
    cerrarHoja(); await hacer('borrarFijo', { id: f.id }, 'Eliminado');
  };
}

/* ---------------- Bienvenida y ajustes ---------------- */
function formConexion(id) {
  return `
    <label class="campo"><span>URL de tu Apps Script (termina en /exec)</span><input id="${id}Url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.cfg?.url || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="campo"><span>Clave secreta</span><input id="${id}Token" placeholder="La que te dio la planilla" value="${esc(S.cfg?.token || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`;
}

async function conectar(id) {
  const url = $('#' + id + 'Url').value.trim(), token = $('#' + id + 'Token').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('La URL tiene que ser la de Apps Script (script.google.com/…/exec)', true);
  if (!token) return toast('Falta la clave secreta', true);
  const antes = S.cfg, antesDemo = S.demo;
  S.cfg = { url, token }; S.demo = false;
  cargando(true);
  try {
    await llamar('datos');
    guardado.set('mc_cfg', S.cfg);
    S.mes = mesActual(); if (S.vista === 'ajustes' && id === 'b') S.vista = 'resumen';
    render(); toast('¡Conectado a tu planilla! 🎉');
  } catch (e) {
    S.cfg = antes; S.demo = antesDemo; toast(e.message, true);
  } finally { cargando(false); }
}

function aplicarTema(t, guardar) {
  t = t || 'auto';
  if (guardar) guardado.set('mc_tema', t);
  const r = document.documentElement;
  if (t === 'claro') r.dataset.theme = 'light'; else if (t === 'oscuro') r.dataset.theme = 'dark'; else delete r.dataset.theme;
  const oscuro = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $$('meta[name="theme-color"]').forEach(x => x.setAttribute('content', oscuro ? '#121715' : '#F6F1E7'));
}
