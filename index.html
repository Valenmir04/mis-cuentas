function abrirFormTarjeta(t) {
  const edit = !!(t && t.id && tarjetasCfg().some(c => c.id === t.id));
  t = t || {};
  abrirHoja(`
    <h2>${edit ? 'Editar tarjeta' : 'Nueva tarjeta de crédito'}</h2>
    <label class="campo"><span>Nombre (como la vas a nombrar al hablarle a Siri)</span><input id="tjNombre" placeholder="Ej: Visa Galicia, Master" value="${esc(t.nombre || '')}"></label>
    <div class="dos">
      <label class="campo"><span>Día de cierre</span><input id="tjCierre" type="number" min="1" max="31" inputmode="numeric" placeholder="Ej: 26" value="${t.cierre || ''}"></label>
      <label class="campo"><span>Día de vencimiento</span><input id="tjVence" type="number" min="1" max="31" inputmode="numeric" placeholder="Ej: 5" value="${t.vence || ''}"></label>
    </div>
    <label class="campo"><span>¿Cuánto te falta pagar del último resumen que ya cerró? (si ya lo pagaste, 0)</span><input id="tjDeuda" class="num" inputmode="decimal" placeholder="$ 0" value="${fmtCampo(t.deudaInicial)}"></label>
    <label class="campo"><span>¿Cuánto llevás gastado en el resumen que todavía no cerró? (en el banco: "consumos del período" o "próximo resumen")</span><input id="tjCons" class="num" inputmode="decimal" placeholder="$ 0" value="${fmtCampo(t.consumosIniciales)}"></label>
    <label class="campo"><span>¿A qué fecha?</span><input id="tjFecha" type="date" value="${esc(t.fecha || hoyISO())}"></label>
    <p class="ayuda">Desde esa fecha, lo que anotes con esta tarjeta se suma al resumen que corresponde según el cierre. Las compras anteriores no se cuentan, porque ya están en estos montos.</p>
    <div class="acciones">${edit ? '<button class="btn peligro" id="tjBorrar">Eliminar</button>' : '<button class="btn" data-cerrar>Cancelar</button>'}<button class="btn prim" id="tjOk">Guardar</button></div>`);
  if (!edit) setTimeout(() => $('#tjNombre').focus(), 250);
  $('#tjOk').onclick = async () => {
    const nombre = $('#tjNombre').value.trim();
    const cierre = +$('#tjCierre').value, vence = +$('#tjVence').value;
    if (!nombre) return toast('Ponele un nombre a la tarjeta', true);
    if (!(cierre >= 1 && cierre <= 31) || !(vence >= 1 && vence <= 31)) return toast('Poné el día de cierre y el de vencimiento (entre 1 y 31)', true);
    const otra = tarjetasCfg().find(c => normSimple(c.nombre) === normSimple(nombre) && c.id !== t.id);
    if (otra) return toast('Ya tenés una tarjeta con ese nombre', true);
    const nueva = { id: t.id || Math.random().toString(36).slice(2, 10), nombre, cierre, vence, deudaInicial: leerMonto($('#tjDeuda').value), consumosIniciales: leerMonto($('#tjCons').value), fecha: $('#tjFecha').value || hoyISO() };
    const lista = tarjetasCfg().filter(c => c.id !== t.id).concat(edit ? [] : [nueva]);
    if (edit) lista.splice(tarjetasCfg().findIndex(c => c.id === t.id), 0, nueva);
    $('#tjOk').disabled = true;
    try { await hacer('guardarAjustes', { ajustes: { tarjetas: lista } }, 'Tarjeta guardada ✓'); cerrarHoja(); } catch (e) { $('#tjOk').disabled = false; }
  };
  if (edit) $('#tjBorrar').onclick = async () => {
    if (!confirm(`¿Eliminar "${t.nombre}"? Las compras que anotaste con esta tarjeta quedan en el historial.`)) return;
    cerrarHoja(); await hacer('guardarAjustes', { ajustes: { tarjetas: tarjetasCfg().filter(c => c.id !== t.id) } }, 'Tarjeta eliminada');
  };
}

/* ---------------- Frases para Siri: formulario ---------------- */
function descFrase(f) {
  return [f.tipo === 'ingreso' ? 'Ingreso' : 'Gasto', f.categoria || 'categoría automática', f.medio || '', f.monto ? plata(f.monto) : 'monto que digas', f.descripcion ? `"${f.descripcion}"` : ''].filter(Boolean).join(' · ');
}

function abrirFormFrase(f) {
  const edit = !!f;
  f = f || { frase: '', tipo: 'gasto', categoria: '', medio: '', monto: '', descripcion: '' };
  let tipo = f.tipo || 'gasto';
  abrirHoja(`
    <h2>${edit ? 'Editar frase' : 'Nueva frase para Siri'}</h2>
    <label class="campo"><span>Cuando diga…</span><input id="frFrase" placeholder='Ej: bondi, cafecito, cobro de Villa Tamen' value="${esc(f.frase)}"></label>
    <div class="seg" id="frTipo"><button type="button" data-v="gasto">Gasto</button><button type="button" data-v="ingreso">Ingreso</button></div>
    <div class="dos">
      <label class="campo"><span>Categoría</span><select id="frCat"></select></label>
      <label class="campo"><span>Medio de pago</span><select id="frMedio"><option value="">Que lo adivine</option>${medios().filter(x => x !== 'Sin especificar').map(x => `<option ${x === f.medio ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
    </div>
    <div class="dos">
      <label class="campo"><span>Monto (opcional)</span><input id="frMonto" class="num" inputmode="decimal" placeholder="El que digas" value="${fmtCampo(f.monto)}"></label>
      <label class="campo"><span>Descripción (opcional)</span><input id="frDesc" placeholder="Ej: Colectivo" value="${esc(f.descripcion || '')}"></label>
    </div>
    <div class="calc" id="frVista"></div>
    <div class="acciones">${edit ? '<button class="btn peligro" id="frBorrar">Eliminar</button>' : '<button class="btn" data-cerrar>Cancelar</button>'}<button class="btn prim" id="frOk">Guardar</button></div>`);
  const llenar = () => {
    $$('#frTipo button').forEach(b => b.classList.toggle('on', b.dataset.v === tipo));
    const actual = $('#frCat').value || f.categoria;
    $('#frCat').innerHTML = `<option value="">Que la adivine</option>` + cats(tipo).map(c => `<option value="${esc(c.nombre)}" ${c.nombre === actual ? 'selected' : ''}>${esc((c.emoji ? c.emoji + ' ' : '') + c.nombre)}</option>`).join('');
    vista();
  };
  const vista = () => {
    const fr = $('#frFrase').value.trim();
    $('#frVista').innerHTML = fr ? `Si decís <b>"${esc(fr)}"</b> se anota: ${esc(descFrase({ tipo, categoria: $('#frCat').value, medio: $('#frMedio').value, monto: leerMonto($('#frMonto').value), descripcion: $('#frDesc').value.trim() }))}` : '';
  };
  $$('#frTipo button').forEach(b => b.onclick = () => { tipo = b.dataset.v; llenar(); });
  ['#frFrase', '#frMonto', '#frDesc'].forEach(s => $(s).oninput = vista);
  $('#frCat').onchange = $('#frMedio').onchange = vista;
  llenar();
  if (!edit) setTimeout(() => $('#frFrase').focus(), 250);
  $('#frOk').onclick = async () => {
    const frase = $('#frFrase').value.trim();
    if (frase.length < 2) return toast('Escribí la frase que vas a decir', true);
    const otra = AJ().frases.find(x => normSimple(x.frase) === normSimple(frase) && x.id !== f.id);
    if (otra) return toast('Ya tenés esa frase', true);
    const nueva = { id: f.id || Math.random().toString(36).slice(2, 10), frase, tipo, categoria: $('#frCat').value, medio: $('#frMedio').value, monto: leerMonto($('#frMonto').value) || '', descripcion: $('#frDesc').value.trim() };
    const lista = AJ().frases.slice();
    const i = lista.findIndex(x => x.id === f.id);
    if (i >= 0) lista[i] = nueva; else lista.push(nueva);
    $('#frOk').disabled = true;
    try { await hacer('guardarAjustes', { ajustes: { frases: lista } }, 'Frase guardada ✓'); cerrarHoja(); } catch (e) { $('#frOk').disabled = false; }
  };
  if (edit) $('#frBorrar').onclick = async () => {
    if (!confirm(`¿Eliminar la frase "${f.frase}"?`)) return;
    cerrarHoja(); await hacer('guardarAjustes', { ajustes: { frases: AJ().frases.filter(x => x.id !== f.id) } }, 'Frase eliminada');
  };
}

async function terminarWizard() {
  const d = S.wiz.d;
  const ajustes = {
    configurado: true,
    saldoInicialARS: d.saldoInicialARS || 0, fechaInicialARS: hoyISO(),
    cuentaUSD: d.cuentaUSD, saldoInicialCuentaUSD: d.cuentaUSD ? d.saldoInicialCuentaUSD || 0 : 0,
    ahorroMonedas: d.ahorroMonedas, saldoInicialAhorroUSD: d.saldoInicialAhorroUSD || 0, saldoInicialAhorroARS: d.saldoInicialAhorroARS || 0,
    tarjetas: d.tieneTarjeta ? d.tarjetas : []
  };
  try {
    await hacer('guardarAjustes', { ajustes }, '¡Listo! Tu app quedó configurada 🎉');

}

  const tarjetas = [{ id: 'visa', nombre: 'Visa', cierre: 26, vence: 5, deudaInicial: 0, consumosIniciales: 0, fecha: inicio }];
  const ajustes = {
    configurado: true, saldoInicialARS: 1800000, fechaInicialARS: inicio, cuentaUSD: true, saldoInicialCuentaUSD: 600,
    ahorroMonedas: ['USD', 'ARS'], saldoInicialAhorroUSD: 2400, saldoInicialAhorroARS: 300000, cotizacionReferencia: 0, tarjetas,
    frases: [{ id: 'f1', frase: 'bondi', tipo: 'gasto', categoria: 'Transporte', medio: 'Mercado Pago', monto: 1000, descripcion: 'Colectivo' },
      { id: 'f2', frase: 'cafecito', tipo: 'gasto', categoria: 'Comida afuera', medio: 'Mercado Pago', monto: '', descripcion: 'Café' }]
  };
  // pagos de la tarjeta: cada día 5 se paga el resumen que cerró el 26 del mes anterior
  for (let k = 4; k >= 0; k--) {
    const d0 = new Date(hoy.getFullYear(), hoy.getMonth() - k, 5);
    if (d0 > hoy) continue;
    const fecha = `${d0.getFullYear()}-${pad(d0.getMonth() + 1)}-05`;
    const monto = Math.round(calcularTarjeta(movs, tarjetas[0], fecha, tarjetas).aPagar);
    if (monto) movs.push({ id: idr(), tipo: 'pagoTarjeta', monto, moneda: 'ARS', fecha, mes: fecha.slice(0, 7), descripcion: 'Pago de tarjeta', categoria: 'Pago de tarjeta', medio: 'Visa', cuotas: '', idFijo: '', origen: 'app', creado: '', cuenta: '' });
  }
  return { categorias: CATS_DEMO, medios: MEDIOS_DEMO, fijos, movimientos: movs, planilla: '', ajustes };
}

function demoApi(accion, x) {
  const d = S.datos, idr = () => Math.random().toString(36).slice(2, 10);
  const norm = m => {
    const fecha = m.fecha || hoyISO();
    const o = { moneda: 'ARS', cuotas: '', idFijo: '', origen: 'app', creado: new Date().toISOString(), cuenta: '', ...m, fecha, mes: fecha.slice(0, 7), monto: Math.abs(+m.monto) || 0 };
    if (o.tipo === 'ahorro' || o.tipo === 'retiro') {
      o.moneda = o.moneda === 'ARS' ? 'ARS' : 'USD';
      o.cuenta = o.moneda === 'USD' && o.cuenta === 'USD' ? 'USD' : 'ARS';
      o.pesos = o.moneda === 'ARS' ? o.monto : o.cuenta === 'USD' ? 0 : Math.abs(+o.pesos) || 0;
    }
    return o;
  };
  const fechaFijo = (f, mes) => mes === mesActual() ? hoyISO() : `${mes}-${pad(Math.min(f.dia, diasDelMes(mes)))}`;
  switch (accion) {
    case 'agregar': d.movimientos.push(norm({ ...x.movimiento, id: idr() })); break;
    case 'editar': { const i = d.movimientos.findIndex(m => m.id === x.id); if (i >= 0) d.movimientos[i] = norm({ ...d.movimientos[i], ...x.movimiento }); break; }
    case 'borrar': d.movimientos = d.movimientos.filter(m => m.id !== x.id); break;
    case 'pagarFijo': { const f = d.fijos.find(f => f.id === x.idFijo); if (f && !d.movimientos.some(m => m.idFijo === f.id && m.mes === x.mes)) d.movimientos.push(norm({ id: idr(), tipo: 'gasto', monto: x.monto || f.monto, moneda: f.moneda || 'ARS', fecha: fechaFijo(f, x.mes), descripcion: f.nombre, categoria: f.categoria, medio: f.medio, idFijo: f.id })); break; }
    case 'despagarFijo': d.movimientos = d.movimientos.filter(m => !(m.idFijo === x.idFijo && m.mes === x.mes)); break;
    case 'guardarFijo': { const i = d.fijos.findIndex(f => f.id === x.fijo.id); if (i >= 0) d.fijos[i] = { ...x.fijo }; else d.fijos.push({ ...x.fijo, id: idr() }); break; }
    case 'borrarFijo': d.fijos = d.fijos.filter(f => f.id !== x.id); break;
    case 'guardarAjustes': {
      d.ajustes = { ...(d.ajustes || {}), ...x.ajustes };
      (x.ajustes.tarjetas || []).forEach(t => { if (!d.medios.some(m => normSimple(m.nombre) === normSimple(t.nombre))) d.medios.unshift({ nombre: t.nombre }); });
      break;
    }
    case 'texto': return Promise.reject(new Error('En el modo ejemplo no interpreto frases. Conectá tu planilla para probarlo.'));
  }
  return Promise.resolve({ ok: true, datos: d });
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-ir],[data-filtro],[data-mov],[data-pagar],[data-editfijo],[data-moneda],[data-tarjeta],[data-verahorro],[data-tema],[data-edittarjeta],[data-editfrase],#nuevoFijo,#nuevoFijo2');
  if (!t) return;
  if (t.dataset.tema) {
    aplicarTema(t.dataset.tema, true);
    $$('[data-tema]').forEach(b => b.classList.toggle('on', b.dataset.tema === t.dataset.tema));
    if (!$('#app').hidden) render();
    return;
  }
  if (t.dataset.moneda) { S.moneda = t.dataset.moneda; guardado.set('mc_moneda', S.moneda); S.vista = 'resumen'; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.verahorro) { S.verAhorroEn = t.dataset.verahorro; guardado.set('mc_verahorro', S.verAhorroEn); render(); return; }
  if (t.dataset.tab || t.dataset.ir) { S.vista = t.dataset.tab || t.dataset.ir; guardado.set('mc_vista', S.vista); cerrarHoja(); render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.filtro) { S.filtro = t.dataset.filtro; $$('[data-filtro]').forEach(c => c.classList.toggle('on', c === t)); renderListaMovs(); return; }
  if (t.dataset.tarjeta) { abrirTarjeta(t.dataset.tarjeta); return; }
  if (t.dataset.edittarjeta) { abrirFormTarjeta(tarjetasCfg().find(c => c.id === t.dataset.edittarjeta)); return; }
  if (t.dataset.editfrase) { abrirFormFrase(AJ().frases.find(f => f.id === t.dataset.editfrase)); return; }
  if (t.dataset.mov) { const m = S.datos.movimientos.find(x => x.id === t.dataset.mov); if (m) abrirMovimiento(m); return; }
  if (t.dataset.pagar) { alternarPago(t.dataset.pagar); return; }
  if (t.dataset.editfijo) { const f = S.datos.fijos.find(x => x.id === t.dataset.editfijo); if (f) abrirFijo(f); return; }
  if (t.id === 'nuevoFijo' || t.id === 'nuevoFijo2') abrirFijo();
});
document.addEventListener('input', e => { if (e.target.id === 'busca') { S.busqueda = e.target.value; renderListaMovs(); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fRapido') return;
  e.preventDefault();
  const inp = $('#txtRapido'), texto = inp.value.trim();
  if (!texto) return;
  try { await hacer('texto', { texto }); inp.value = ''; } catch (err) {}
});
$('#fab').onclick = () => S.vista === 'fijos' ? abrirFijo() : abrirMovimiento(null, S.vista === 'ahorros' ? 'ahorro' : 'gasto');
$('#mesPrev').onclick = () => { S.mes = moverMes(S.mes, -1); render(); };
$('#mesNext').onclick = () => { S.mes = moverMes(S.mes, 1); render(); };
$('#btnSync').onclick = () => refrescar(true);
$('#capa').addEventListener('click', e => { if (e.target.id === 'capa') cerrarHoja(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg && !S.demo) refrescar(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (temaActual() === 'auto') { aplicarTema('auto'); if (!$('#app').hidden) render(); } });

async function refrescar(avisar) {
  if (S.demo) { render(); return; }
  if (!S.cfg) return;
  cargando(true);
  try { await llamar('datos'); render(); if (avisar) toast('Actualizado'); }
  catch (e) { toast(e.message, true); }
  finally { cargando(false); }
}

/* ---------------- Arranque ---------------- */
aplicarTema(temaActual());
if (S.cfg) S.datos = guardado.get('mc_cache');
render();
refrescar();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(() => { if (!$('#capa').classList.contains('on')) mostrarGuiaInstalar(false); }, 1200);
</script>
